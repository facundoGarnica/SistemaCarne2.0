# ==============================================================
#  Configuración del sistema en ESTA PC
#  Se lee al abrir el sistema. Si cambiás algo, cerrá y volvé a abrir.
#  (Si se borra este archivo, se usan los datos que vienen en el sistema:
#   MySQL local, base carnedb, usuario root, contraseña 1234.)
# ==============================================================

# Base de datos MySQL
db.url=jdbc:mysql://localhost:3306/carnedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.usuario=root
db.contrasena=1234

# Carpeta "bin" de MySQL, donde está mysqldump.exe (para las copias de la base).
# Dejar vacío para que se busque sola. Usar / en vez de \ , por ejemplo:
# mysql.bin=C:/Program Files/MySQL/MySQL Server 8.0/bin
mysql.bin=
